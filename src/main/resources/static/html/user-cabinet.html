<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аукцион - Личный кабинет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../library/jquery-3.7.1.min.js" defer></script>
    <link href="../style/main.css" rel="stylesheet" type="text/css"/>
</head>
<body>
<!-- Навигация -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Аукцион</span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="main.html">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="auctions.html">Аукционы</a>
                </li>
                <li id="user-cabinet-item" class="nav-item hidden">
                    <a class="nav-link" href="user-cabinet.html">Личный кабинет</a>
                </li>
            </ul>
            <div class="navbar-nav align-items-center">
                <span id="server-time" class="navbar-text me-3"></span>
                <span id="user-info" class="navbar-text me-3"></span>

                <!-- Кнопка Войти -->
                <div id="login-item" class="nav-item">
                    <a href="auth.html" class="btn btn-outline-light btn-sm me-2">Войти</a>
                </div>

                <!-- Кнопка Выйти -->
                <div id="logout-item" class="nav-item hidden">
                    <button id="logout-btn" class="btn btn-outline-light btn-sm">Выйти</button>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4">Личный кабинет</h2>
    <div class="row">
        <div class="col-md-4">
            <div class="card mb-4">
                <div class="card-header">
                    <h5>Мой профиль</h5>
                </div>
                <div class="card-body text-center">
                    <img id="user-avatar" src="https://via.placeholder.com/100x100" class="rounded-circle mb-3" width="100" height="100" alt="Аватар">
                    <div class="mb-3">
                        <input type="file" id="avatar-upload" accept="image/*" class="form-control">
                        <small class="text-muted">Загрузите фото профиля</small>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card mb-4">
                <div class="card-header">
                    <h5>Мои данные</h5>
                </div>
                <div class="card-body">
                    <form id="user-data-form">
                        <div class="mb-3">
                            <label for="user-name" class="form-label">Имя</label>
                            <input type="text" class="form-control" id="user-name">
                        </div>
                        <div class="mb-3">
                            <label for="user-email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="user-email">
                        </div>
                        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header">
                    <h5>Мои ставки</h5>
                </div>
                <div class="card-body">
                    <div id="user-bids">
                        <p class="text-muted">У вас пока нет ставок</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5>Выигранные лоты</h5>
                </div>
                <div class="card-body">
                    <div id="won-lots">
                        <p class="text-muted">У вас пока нет выигранных лотов</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
