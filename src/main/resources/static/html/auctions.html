<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аукцион - Аукционы</title>
    <script src="../library/bootstrap.bundle.min.js" defer></script>
    <link href="../library/bootstrap.min.css" rel="stylesheet" type="text/css"/>
    <script src="../library/jquery-3.7.1.min.js" defer></script>
    <link href="../style/main.css" rel="stylesheet" type="text/css"/>
    <script src="../js/auctions.js" defer></script>
</head>
<body>
<!-- Навигация -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Аукцион</span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="main.html">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="auctions.html">Аукционы</a>
                </li>
                <li id="user-cabinet-item" class="nav-item hidden">
                    <a class="nav-link" href="user-cabinet.html">Личный кабинет</a>
                </li>
            </ul>
            <div class="navbar-nav align-items-center">
                <span id="server-time" class="navbar-text me-3"></span>
                <span id="user-info" class="navbar-text me-3"></span>

                <!-- Кнопка Войти -->
                <div id="login-item" class="nav-item">
                    <a href="auth.html" class="btn btn-outline-light btn-sm me-2">Войти</a>
                </div>

                <!-- Кнопка Выйти -->
                <div id="logout-item" class="nav-item hidden">
                    <button id="logout-btn" class="btn btn-outline-light btn-sm">Выйти</button>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Активные аукционы</h2>
        <div id="auction-filters" class="btn-group">
            <button class="btn btn-outline-primary active" data-filter="all">Все</button>
            <button class="btn btn-outline-primary" data-filter="ending">Заканчивающиеся</button>
            <button class="btn btn-outline-primary" data-filter="new">Новые</button>
        </div>
    </div>
    <div class="row" id="auctions-list">
        <div class="col-12 text-center">
            <p class="text-muted">Аукционы пока отсутствуют</p>
        </div>
    </div>
</div>
</body>
</html>
